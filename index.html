<title>BaseVault</title>
<style>
:root{
 --bg:#0b0a0e;--surface:#121117;--surface2:#18171e;--surface3:#211f29;
 --line:#2d2a37;--text:#f7f5fa;--muted:#aaa6b7;--purple:#8b4dff;--purple2:#6330df;

}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 75% -10%,#21153d 0,#0b0a0e 34%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{border:0;color:inherit;cursor:pointer}

.app{min-height:100vh;max-width:760px;margin:auto;padding:20px 16px 150px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px;min-width:0}
.brandbox{display:flex;align-items:center;gap:11px;flex:1;min-width:0;overflow:hidden}

.folder:before{content:"";position:absolute;left:8px;top:-17px;width:38px;height:22px;border:3px solid #575264;border-bottom:0;border-radius:12px 12px 0 0;background:#17151e}
.folder:after{content:"＋";position:absolute;right:-19px;bottom:-16px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#9a55ff,#6027dd);color:#fff;font-size:27px;border:3px solid #1a1722}

.input,.textarea{width:100%;background:#211f27;border:1px solid #36323f;color:var(--text);border-radius:13px;padding:12px;outline:none}.textarea{min-height:90px;resize:vertical}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat-card{background:#15141b;border:1px solid #302d39;border-radius:20px;padding:18px}.stat-card span,.stat-card small{display:block;color:#9691a2;font-size:12px}.stat-card strong{display:block;font-size:28px;margin:7px 0}.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tool-card{text-align:left;background:linear-gradient(145deg,#181620,#111016);border:1px solid #312d3c;border-radius:20px;padding:17px;min-height:140px}.tool-card:hover{border-color:#7650b7;background:#1b1822}.tool-icon{display:block;font-size:25px;color:#aa78ff;margin-bottom:12px}.tool-card strong,.tool-card small{display:block}.tool-card small{color:#9893a3;margin-top:6px;line-height:1.4}.tool-list{display:grid;gap:2px}.tool-list>div{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #292631}.tool-list>div:last-child{border-bottom:0}.tool-list span{display:flex;flex-direction:column;gap:4px}.tool-list small{color:#94909e}.settings-list{padding:7px}.settings-list button{width:100%;display:grid;grid-template-columns:30px 1fr 20px;align-items:center;text-align:left;gap:9px;background:transparent;padding:15px 10px;border-radius:14px}.settings-list button:hover{background:#211e29}.settings-list button span:nth-child(2){display:flex;flex-direction:column;gap:4px}.settings-list small{color:#94909e}.settings-list i{color:#817b8c;font-size:24px;font-style:normal}.danger-card{border-color:#432730}

.income-mini{display:inline-block;color:#b78cff;font-size:11px;margin-top:5px;font-weight:700}.income-box{background:linear-gradient(145deg,#121117,#17131f);border:1px solid #302d39;border-radius:18px;padding:16px;margin-top:16px;overflow:hidden}.income-head{display:grid;grid-template-columns:minmax(0,1fr);gap:13px}.income-total{font-size:24px;font-weight:850;margin-top:3px}.income-add{width:100%;min-height:46px;box-sizing:border-box;white-space:nowrap;justify-content:center;border:1px solid #6e3cc2;background:linear-gradient(135deg,#2b1d42,#4a247d);color:#f5efff;border-radius:14px;font-weight:750;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}.income-add:hover{border-color:#9b68ee;background:linear-gradient(135deg,#35234f,#5a2d93)}.income-list{display:grid;gap:7px;margin-top:12px}.income-toggle{width:100%;margin-top:12px;display:flex;align-items:center;justify-content:space-between;text-align:left;background:#18151e;border:1px solid #302d39;border-radius:12px;padding:11px 12px;color:#e9e5ef}.income-toggle:hover{border-color:#4b4558}.income-toggle .chev{font-size:14px;color:#b78cff}.income-list.collapsed{display:none}.income-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #292631}.income-row span{min-width:0;display:flex;flex-direction:column;gap:4px}.income-row small{color:#94909e;font-size:11px;overflow:hidden;text-overflow:ellipsis}.income-empty{padding-top:12px}.income-row .danger,.income-row .smallbtn{width:36px;height:36px;padding:0;border-radius:11px}.income-row>button{flex:0 0 36px}.range-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.range-grid{grid-template-columns:1fr}}.income-box .income-row strong{font-size:15px;color:#e9e5ef}
.profile-card{cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}.profile-card:hover{transform:translateY(-1px);border-color:#5d4a79;box-shadow:0 12px 32px #0005}.profile-card:focus-visible{outline:2px solid #9b68ff;outline-offset:2px}

.fullbtn{width:100%;margin-top:10px}.recovery-sheet{text-align:center}.recovery-icon{font-size:42px;margin-bottom:6px}.recovery-code{margin:18px 0;padding:16px;background:#100e15;border:1px solid #6f45aa;border-radius:15px;color:#d7c4ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.8;word-break:break-all}.recovery-warning{background:#2d1d24;border:1px solid #58303b;color:#e9aeb8;border-radius:13px;padding:12px;text-align:left;font-size:12px;line-height:1.5}

.favorite-btn{font-size:20px;color:#aaa3b2}.favorite-btn.is-favorite{color:#b978ff;background:#2b1d3d}.favorite-detail{color:#c58bff;border-color:#6e43a4}.pill .dot.off{background:#716b78}

<body>
<div id="root"></div>
<script>
"use strict";
const APP="BaseVault", DB="basevault-db", STORE="vault";
let state={key:null,profiles:[],query:"",editing:null,profileView:null,filter:"all",incomeProfileId:null,billingMonth:null,billingStatus:{},incomeExpanded:{},notesExpanded:{},lastSavedAt:null,rangeFrom:"",rangeTo:"",autoLockMinutes:0,lastActivityAt:null};
let autoLockTimer=null;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rand=n=>crypto.getRandomValues(new Uint8Array(n));
const hex=a=>Array.from(new Uint8Array(a),b=>b.toString(16).padStart(2,"0")).join("");
const hexBytes=s=>{if(!/^[0-9a-fA-F]{64}$/.test(s))throw new Error("Ungültiger Wiederherstellungsschlüssel");const a=new Uint8Array(32);for(let i=0;i<64;i+=2)a[i/2]=parseInt(s.slice(i,i+2),16);return a};
async function recoveryKey(code){return crypto.subtle.importKey("raw",hexBytes(code.trim().replace(/[\s-]/g,"")),"AES-GCM",false,["encrypt","decrypt"])}
function formatRecoveryCode(code){return code.match(/.{1,8}/g)?.join("-")||code}


function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbGet(){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,"readonly"),r=t.objectStore(STORE).get("vault");r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function dbPut(v){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,"readwrite");t.objectStore(STORE).put(v,"vault");t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function derive(pass,salt){return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]),{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encrypt(key,data){const iv=rand(12),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(data)));return {iv:b64(iv),data:b64(ct)}}
async function decrypt(key,obj){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(obj.iv)},key,unb64(obj.data));return JSON.parse(new TextDecoder().decode(pt))}
function renderSetup(){document.getElementById("root").innerHTML=`<div class="setup"><div class="card"><div class="brand">🔐 BaseVault</div><h2>Dein lokaler Tresor</h2><p class="small">Lege ein Master-Passwort fest. Die Zugangsdaten werden lokal im Browser verschlüsselt gespeichert. Das Passwort selbst wird nicht gespeichert.</p><div class="field"><div class="label">Master-Passwort</div><input id="p1" class="input" type="password" autocomplete="new-password"></div><div class="field"><div class="label">Wiederholen</div><input id="p2" class="input" type="password" autocomplete="new-password"></div><button class="primary" onclick="createVault()">Tresor erstellen</button></div></div>`}
async function createVault(){
 const a=p1.value,b=p2.value;
 if(!a||a.length<8)return alert("Bitte mindestens 8 Zeichen verwenden.");
 if(a!==b)return alert("Die Passwörter stimmen nicht überein.");
 const salt=rand(16),key=await derive(a,salt);
 const recoveryCode=hex(rand(32));
 const rkey=await recoveryKey(recoveryCode);
 const empty=[];
 const record={v:2,salt:b64(salt),check:await encrypt(key,{ok:true}),payload:await encrypt(key,empty),recovery:await encrypt(rkey,empty),wrappedRecoveryKey:await encrypt(key,{code:recoveryCode}),autoLockMinutes:0};
 await dbPut(record);
 state.key=key;state.profiles=[];state.billingStatus={};state.lastSavedAt=Date.now();state.autoLockMinutes=0;startAutoLock();
 alert("Tresor erstellt. Dein Wiederherstellungsschlüssel wird jetzt angezeigt. Speichere ihn sicher außerhalb der App.");
 showRecoveryCode(recoveryCode,true);
 renderApp();
}
function showRecoveryCode(code,first=false){
 const modal=document.createElement("div");
 modal.className="modal open";
 modal.innerHTML=`<div class="sheet recovery-sheet">
  <div class="recovery-icon">🔑</div>
  <h2>${first?"Wiederherstellungsschlüssel":"Recovery-Schlüssel"}</h2>
  <p class="small">Mit diesem Schlüssel kannst du dein Master-Passwort zurücksetzen, ohne die gespeicherten Accounts zu verlieren.</p>
  <div class="recovery-code">${esc(formatRecoveryCode(code))}</div>

async function resetMaster(){
 try{
  const code=recoveryInput.value.replace(/[\s-]/g,"");
  const newPass=newMaster.value,newPass2=newMaster2.value;
  if(!/^[0-9a-fA-F]{64}$/.test(code))return alert("Der Wiederherstellungsschlüssel muss 64 Hex-Zeichen enthalten.");
  if(!newPass||newPass.length<8)return alert("Das neue Master-Passwort muss mindestens 8 Zeichen haben.");
  if(newPass!==newPass2)return alert("Die neuen Passwörter stimmen nicht überein.");
  const v=await dbGet();
  if(!v||!v.recovery)throw new Error("Für diesen Tresor ist kein Wiederherstellungsschlüssel eingerichtet.");
  const rkey=await recoveryKey(code);
  const profiles=await decrypt(rkey,v.recovery);
  const salt=rand(16),key=await derive(newPass,salt);
  v.salt=b64(salt);
  v.check=await encrypt(key,{ok:true});
  v.payload=await encrypt(key,profiles);
  v.wrappedRecoveryKey=await encrypt(key,{code});
  v.lastSavedAt=Date.now();
  v.autoLockMinutes=Number(v.autoLockMinutes)||0;
  await dbPut(v);
  state.key=key;state.profiles=profiles.map(p=>({...p,incomes:Array.isArray(p.incomes)?p.incomes:[]}));state.billingStatus=v.billingStatus||{};state.lastSavedAt=v.lastSavedAt||null;state.autoLockMinutes=Number(v.autoLockMinutes)||0;state.profileView=null;state.editing=null;startAutoLock();
  alert("Master-Passwort wurde erfolgreich geändert.");
  renderApp();
 }catch(e){alert("Wiederherstellung fehlgeschlagen. Prüfe den Schlüssel und versuche es erneut.")}
}
async function unlock(){try{const v=await dbGet(),key=await derive(document.getElementById("loginpass").value,unb64(v.salt));await decrypt(key,v.check);state.key=key;state.profiles=(await decrypt(key,v.payload)).map(p=>({...p,favorite:!!p.favorite,active:p.active!==false,incomes:Array.isArray(p.incomes)?p.incomes:[]}));state.billingStatus=v.billingStatus||{};state.lastSavedAt=v.lastSavedAt||null;state.autoLockMinutes=Number(v.autoLockMinutes)||0;startAutoLock();renderApp()}catch(e){alert("Falsches Master-Passwort oder beschädigter Tresor.")}}

async function changeMasterPassword(){
 const modal=document.querySelector(".change-pass-modal");
 const oldPass=document.getElementById("changeOldMaster")?.value||"";
 const newPass=document.getElementById("changeNewMaster")?.value||"";
 const newPass2=document.getElementById("changeNewMaster2")?.value||"";
 if(!oldPass)return alert("Bitte dein aktuelles Master-Passwort eingeben.");
 if(!newPass||newPass.length<8)return alert("Das neue Master-Passwort muss mindestens 8 Zeichen haben.");
 if(newPass!==newPass2)return alert("Die neuen Passwörter stimmen nicht überein.");
 try{
   const v=await dbGet();
   if(!v)throw new Error("Kein Tresor gefunden.");
   const oldKey=await derive(oldPass,unb64(v.salt));
   await decrypt(oldKey,v.check);
   const profiles=await decrypt(oldKey,v.payload);
   const salt=rand(16),newKey=await derive(newPass,salt);

   // Keep the existing Recovery-Key usable after the password change.
   let wrappedRecoveryKey=v.wrappedRecoveryKey;
   if(v.wrappedRecoveryKey){
     const wrapped=await decrypt(oldKey,v.wrappedRecoveryKey);
     wrappedRecoveryKey=await encrypt(newKey,{code:wrapped.code});
   }

   v.salt=b64(salt);
   v.check=await encrypt(newKey,{ok:true});
   v.payload=await encrypt(newKey,profiles);
   v.wrappedRecoveryKey=wrappedRecoveryKey;
   v.lastSavedAt=Date.now();
   v.billingStatus=v.billingStatus||state.billingStatus||{};
   v.autoLockMinutes=Number(state.autoLockMinutes)||Number(v.autoLockMinutes)||0;
   await dbPut(v);

   state.key=newKey;
   state.profiles=profiles.map(p=>({...p,favorite:!!p.favorite,active:p.active!==false,incomes:Array.isArray(p.incomes)?p.incomes:[]}));
   state.billingStatus=v.billingStatus||{};
   state.lastSavedAt=v.lastSavedAt;
   state.autoLockMinutes=Number(v.autoLockMinutes)||0;
   startAutoLock();
   modal?.remove();
   alert("Master-Passwort wurde erfolgreich geändert.");
   renderApp();
 }catch(e){
   alert("Das aktuelle Master-Passwort ist falsch oder der Tresor konnte nicht gelesen werden.");
 }
}

async function getRecoveryCode(){
 const v=await dbGet();
 if(!v||!v.wrappedRecoveryKey) return null;
 try{
   const wrapped=await decrypt(state.key,v.wrappedRecoveryKey);
   return wrapped.code;
 }catch(e){return null}
}
async function setupRecovery(forceRotate=false){
 const v=await dbGet();
 if(v.recovery && !forceRotate){
   const existing=await getRecoveryCode();
   if(existing) return showRecoveryCode(existing,false);
 }
 const code=hex(rand(32));
 const rkey=await recoveryKey(code);
 v.recovery=await encrypt(rkey,state.profiles);
 v.wrappedRecoveryKey=await encrypt(state.key,{code});
 await dbPut(v);
 showRecoveryCode(code,false);
}
async function rotateRecovery(){
 const current=await getRecoveryCode();
 if(!current)return setupRecovery(false);
 if(!confirm("Einen neuen Recovery-Key erzeugen? Der bisherige Recovery-Key wird danach ungültig."))return;
 await setupRecovery(true);
}

}

function setBillingMonth(value){state.billingMonth=/^\d{4}-\d{2}$/.test(value)?value:null;renderApp();setTimeout(()=>document.getElementById("billingCard")?.scrollIntoView({behavior:"smooth",block:"start"}),0)}

function money(value){return new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(Number(value||0))}
function toDateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const PAYOUT_THRESHOLD=3000;
const PAYOUT_RATE_STANDARD=0.20;
const PAYOUT_RATE_HIGH=0.25;
function incomeTotal(p){return (p.incomes||[]).reduce((s,i)=>s+Number(i.amount||0),0)}
function payoutRate(value){return Number(value||0)>=PAYOUT_THRESHOLD?PAYOUT_RATE_HIGH:PAYOUT_RATE_STANDARD}
function payoutRateLabel(value){return Math.round(payoutRate(value)*100)+" %"}
function payoutTotal(value){const n=Number(value||0);return n*payoutRate(n)}
function incomeSection(p){
 const entries=[...(p.incomes||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date))||Number(b.createdAt||0)-Number(a.createdAt||0));

 return `<div class="income-box"><div class="income-head"><div><div class="label">EINNAHMEN</div><div class="income-total">${money(incomeTotal(p))}</div><div class="small">Dein Erlös (${payoutRateLabel(incomeTotal(p))}): <b>${money(payoutTotal(incomeTotal(p)))}</b></div></div><button type="button" class="ghost income-add" onclick="openIncome('${p.id}')">＋ Einnahme hinzufügen</button></div>${entries.length?`<button type="button" class="income-toggle" aria-expanded="${expanded}" onclick="toggleIncomeList('${p.id}')"><span>${expanded?"Einzahlungen ausblenden":"Einzahlungen anzeigen"} <small>(${entries.length})</small></span><span class="chev">${expanded?"⌃":"⌄"}</span></button><div class="income-list${expanded?"":" collapsed"}">${entries.map(i=>`<div class="income-row"><span><b>${money(i.amount)}</b><small>${esc(i.date)}${i.note?` · ${esc(i.note)}`:""}</small></span><button type="button" class="smallbtn" title="Einnahme bearbeiten" onclick="editIncome('${p.id}','${i.id}')">✎</button><button type="button" class="smallbtn danger" title="Einnahme löschen" onclick="deleteIncome('${p.id}','${i.id}')">×</button></div>`).join("")}</div>`:`<div class="small income-empty">Noch keine Einnahmen für diesen Account.</div>`}</div>`;

async function saveIncome(){
 const p=state.profiles.find(x=>x.id===state.incomeProfileId); if(!p)return;
 const amount=Number(String(document.getElementById("incomeAmount")?.value||"").replace(",","."));
 const date=document.getElementById("incomeDate")?.value||toDateKey(new Date());
 const note=(document.getElementById("incomeNote")?.value||"").trim();

 p.incomes=Array.isArray(p.incomes)?p.incomes:[];
 p.incomes.push({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),amount:Math.round(amount*100)/100,date,note,createdAt:Date.now()});
 await persist();state.incomeProfileId=null;renderApp();
}
async function editIncome(profileId,incomeId){const p=state.profiles.find(x=>x.id===profileId);const i=p?.incomes?.find(x=>x.id===incomeId);if(!i)return;const amount=prompt("Betrag (€):",String(i.amount).replace(".",","));if(amount===null)return;const n=Number(String(amount).replace(",","."));if(!Number.isFinite(n)||n<=0)return alert("Bitte einen gültigen Betrag eingeben.");const date=prompt("Datum (JJJJ-MM-TT):",i.date||toDateKey(new Date()));if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return alert("Bitte ein gültiges Datum verwenden.");const note=prompt("Notiz (optional):",i.note||"");if(note===null)return;i.amount=Math.round(n*100)/100;i.date=date;i.note=note.trim();await persist();if(state.profileView?.id===profileId)state.profileView={...p,showPass:false};renderApp()}
async function deleteIncome(profileId,incomeId){const p=state.profiles.find(x=>x.id===profileId);if(!p)return;if(!confirm("Diese Einnahme wirklich löschen?"))return;p.incomes=(p.incomes||[]).filter(i=>i.id!==incomeId);await persist();if(state.profileView?.id===profileId)state.profileView={...p,showPass:false};renderApp()}

function editor(){if(!state.editing)return "";const p=state.editing;return `<div id="modal" class="modal open"><div class="sheet"><h2>${p.id?"Profil bearbeiten":"Neues Profil"}</h2><div class="field"><div class="label">Profilname</div><input id="fName" class="input" value="${esc(p.name)}" placeholder="z. B. Creator 01"></div><div class="field"><div class="label">Username / E-Mail</div><input id="fUser" class="input" value="${esc(p.user)}"></div><div class="field"><div class="label">Passwort</div><input id="fPass" class="input" type="password" value="${esc(p.pass)}"></div><div class="field"><div class="label">4based URL</div><input id="fUrl" class="input" value="${esc(p.url||"https://4based.com/")}"></div><div class="field"><div class="label">Notizen</div><textarea id="fNotes" class="textarea">${esc(p.notes)}</textarea></div>
 <div class="actions">
   <button type="button" class="ghost" onclick="state.editing.favorite=!state.editing.favorite;renderApp()">☆ Favorit: ${p.favorite?"An":"Aus"}</button>
   <button type="button" class="ghost" onclick="state.editing.active=state.editing.active===false;renderApp()">● Status: ${p.active===false?"Inaktiv":"Aktiv"}</button>
 </div><div class="actions"><button type="button" class="ghost" onclick="closeEditor()">Abbrechen</button><button type="button" class="primary" onclick="saveProfile()">Speichern</button></div>${p.id?`<div class="actions"><button type="button" class="ghost danger" onclick="deleteProfile('${p.id}')">Profil löschen</button><button type="button" class="ghost" onclick="copyText('${encodeURIComponent(p.user)}')">Username kopieren</button></div>`:""}</div></div>`}
function openEditor(id){const p=state.profiles.find(x=>x.id===id);state.editing=p?{...p}: {id:"",name:"",user:"",pass:"",url:"https://4based.com/",notes:"",favorite:false,active:true,incomes:[]};renderApp();setTimeout(()=>document.getElementById("fName")?.focus(),0)}
function closeEditor(){state.editing=null;renderApp()}
async function saveProfile(){const p=state.editing;p.name=document.getElementById("fName").value.trim();p.user=document.getElementById("fUser").value.trim();p.pass=document.getElementById("fPass").value;p.url=document.getElementById("fUrl").value.trim()||"https://4based.com/";p.notes=document.getElementById("fNotes").value;if(!p.name||!p.user||!p.pass)return alert("Name, Username und Passwort brauchen einen Wert.");if(!/^https:\/\/4based\.com(?:\/|$)/i.test(p.url))return alert("Bitte eine gültige 4based-URL verwenden.");if(!p.id){p.id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));state.profiles.unshift(p)}else{const i=state.profiles.findIndex(x=>x.id===p.id);state.profiles[i]=p}await persist();state.editing=null;renderApp()}
async function deleteProfile(id){if(!confirm("Profil wirklich löschen?"))return;state.profiles=state.profiles.filter(p=>p.id!==id);await persist();state.editing=null;renderApp()}
async function persist(){
 const v=await dbGet();
 v.payload=await encrypt(state.key,state.profiles);
 if(v.wrappedRecoveryKey){
   const wrapped=await decrypt(state.key,v.wrappedRecoveryKey);
   const rkey=await recoveryKey(wrapped.code);
   v.recovery=await encrypt(rkey,state.profiles);
 }
 state.lastSavedAt=Date.now();
 v.lastSavedAt=state.lastSavedAt;
 v.billingStatus=state.billingStatus||{};
 v.autoLockMinutes=Number(state.autoLockMinutes)||0;
 await dbPut(v);
}
function togglePass(){const el=document.getElementById("fPass");el.type=el.type==="password"?"text":"password"}
async function copyCurrent(id){const el=document.getElementById(id);if(!el)return;await copyText(el.value)}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}setTimeout(()=>{try{navigator.clipboard.writeText("")}catch(e){}},30000)}
function openUrl(){const url=document.getElementById("fUrl").value.trim();if(/^https:\/\/4based\.com(?:\/|$)/i.test(url))window.open(url,"_blank","noopener,noreferrer")}

function autoLockLabel(){
 const m=Number(state.autoLockMinutes)||0;
 if(!m)return "Deaktiviert";
 if(m<60)return `Nach ${m} Minute${m===1?"":"n"} Inaktivität`;
 const h=m/60;
 return `Nach ${h===1?"1 Stunde":h+" Stunden"} Inaktivität`;
}
function clearAutoLockTimer(){
 if(autoLockTimer){clearTimeout(autoLockTimer);autoLockTimer=null}
}
function startAutoLock(){
 clearAutoLockTimer();
 if(!state.key || !Number(state.autoLockMinutes))return;
 state.lastActivityAt=Date.now();
 scheduleAutoLock();
}
function scheduleAutoLock(){
 clearAutoLockTimer();
 const minutes=Number(state.autoLockMinutes)||0;
 if(!state.key || !minutes)return;
 const ms=minutes*60*1000;
 const elapsed=Date.now()-(state.lastActivityAt||Date.now());
 const remaining=Math.max(250,ms-elapsed);
 autoLockTimer=setTimeout(()=>{
   if(!state.key)return;
   if(Date.now()-(state.lastActivityAt||Date.now())>=ms){
     lock();
     alert(`BaseVault wurde nach ${autoLockLabel().replace(/^Nach /,"")} automatisch gesperrt.`);
   }else{
     scheduleAutoLock();
   }
 },remaining);
}
function noteActivity(){
 if(!state.key || !Number(state.autoLockMinutes))return;
 state.lastActivityAt=Date.now();
 scheduleAutoLock();
}
function showAutoLockSettings(){
 const current=Number(state.autoLockMinutes)||0;
 const options=[0,1,5,10,15,30,60];
 const root=document.createElement("div");
 root.className="auto-lock-modal";
 root.innerHTML=`<div class="auto-lock-sheet" role="dialog" aria-modal="true">
   <h3>Automatische Sperre</h3>
   <p>BaseVault sperrt den Tresor automatisch, wenn innerhalb der gewählten Zeit keine Aktivität erkannt wird. Die Einstellung wird lokal gespeichert.</p>
   <div class="auto-lock-options">
    ${options.map(m=>`<button class="auto-lock-option ${m===current?"active":""}" onclick="setAutoLock(${m},this)">
      <strong>${m===0?"Deaktiviert":m<60?m+" Minute"+(m===1?"":"n"):"1 Stunde"}</strong>
      <small>${m===0?"Keine automatische Sperre":m<60?"Bei Inaktivität automatisch sperren":"Bei Inaktivität automatisch sperren"}</small>
    </button>`).join("")}
   </div>
   <button class="ghost auto-lock-close" onclick="this.closest('.auto-lock-modal').remove()">Schließen</button>
 </div>`;
 document.body.appendChild(root);
 root.addEventListener("click",e=>{if(e.target===root)root.remove()});
}
async function setAutoLock(minutes,button){
 state.autoLockMinutes=Number(minutes)||0;
 if(state.key){
   await persist();
   startAutoLock();
 }
 document.querySelector(".auto-lock-modal")?.remove();
 renderApp();
}

function lock(){clearAutoLockTimer();state.key=null;state.profiles=[];state.editing=null;state.profileView=null;state.lastActivityAt=null;renderLogin()}

["pointerdown","keydown","touchstart","scroll"].forEach(evt=>{
 document.addEventListener(evt,()=>noteActivity(),{passive:true});
});
document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="visible" && state.key && Number(state.autoLockMinutes)){
   const ms=Number(state.autoLockMinutes)*60*1000;
   if(Date.now()-(state.lastActivityAt||Date.now())>=ms){
     lock();
     alert(`BaseVault wurde nach ${autoLockLabel().replace(/^Nach /,"")} automatisch gesperrt.`);
   }else{
     scheduleAutoLock();
   }
 }
});

(async()=>{const v=await dbGet();v?renderLogin():renderSetup()})();
</script>
