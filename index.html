<body>
<div id="root"></div>
<script>
"use strict";
/* =========================================================================
   BaseVault – lokaler, verschlüsselter Account-Tresor (eine Datei, offline)
   Speicher: IndexedDB · Krypto: Web Crypto (PBKDF2-SHA-256 + AES-256-GCM)
   Gliederung: Konstanten · Helfer · Krypto · IndexedDB · Zustand · Auto-Sperre
               Tresor · Persistenz · Aktionen · Auswertung · Ansichten · Events
   ========================================================================= */

/* --- 1. Konstanten ------------------------------------------------------- */
const DB_NAME="basevault-db", STORE="vault", RECORD_KEY="vault", SCHEMA_VERSION=2;
const PBKDF2_ITERATIONS=250000, MIN_PASSWORD_LENGTH=8;
const PAYOUT_THRESHOLD=3000, PAYOUT_RATE_STANDARD=.2, PAYOUT_RATE_HIGH=.25;
const AUTOLOCK_CHECK_MS=5000, AUTOLOCK_OPTIONS=[0,1,5,10,15,30,60];
const NAV_ITEMS=[{id:"dashboard",icon:"▦",label:"Dashboard"},{id:"stats",icon:"▥",label:"Statistiken"},{id:"tools",icon:"⌁",label:"Tools"},{id:"settings",icon:"⚙",label:"Einstellungen"}];
const FILTER_ITEMS=[{id:"all",icon:"▦",label:"Alle"},{id:"4based",icon:"♨",label:"4based"},{id:"favorites",icon:"☆",label:"Favoriten"},{id:"active",icon:"●",label:"Aktiv"}];
const NAV_VIEWS=NAV_ITEMS.map(item=>item.id);

/* --- 2. Helfer ---------------------------------------------------------- */
const ESCAPES={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>ESCAPES[char]);
const $=id=>document.getElementById(id);
const fieldValue=id=>String($(id)?.value??"");
const focusSoon=id=>requestAnimationFrame(()=>$(id)?.focus());
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const toDateKey=date=>date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");
const roundAmount=value=>Math.round(value*100)/100;
const eurFormat=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
const monthFormat=new Intl.DateTimeFormat("de-DE",{month:"long",year:"numeric"});
const stampFormat=new Intl.DateTimeFormat("de-DE",{dateStyle:"short",timeStyle:"medium"});
const money=value=>eurFormat.format(Number(value)||0);
const download=(filename,text,type="text/plain;charset=utf-8")=>{
 const url=URL.createObjectURL(new Blob([text],{type})),link=document.createElement("a");
 link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
};

/* --- 3. Krypto ---------------------------------------------------------- */
const encoder=new TextEncoder(), decoder=new TextDecoder();
const rand=length=>crypto.getRandomValues(new Uint8Array(length));
const toBytes=value=>value instanceof Uint8Array?value:new Uint8Array(value);
const hex=value=>{let out="";for(const byte of toBytes(value))out+=byte.toString(16).padStart(2,"0");return out};
/* Chunkweise konvertieren – verhindert "Maximum call stack size exceeded" bei großen Tresoren. */
const b64=value=>{const bytes=toBytes(value);let binary="";const CHUNK=0x8000;for(let i=0;i<bytes.length;i+=CHUNK)binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+CHUNK));return btoa(binary)};
const unb64=text=>Uint8Array.from(atob(text),char=>char.charCodeAt(0));
function hexBytes(code){
 const clean=String(code).trim().replace(/[\s-]/g,"");
 if(!/^[0-9a-fA-F]{64}$/.test(clean))throw new Error("Ungültiger Wiederherstellungsschlüssel");
 const bytes=new Uint8Array(32);
 for(let i=0;i<32;i++)bytes[i]=parseInt(clean.slice(i*2,i*2+2),16);
 return bytes;
}
const formatRecoveryCode=code=>code.match(/.{1,8}/g)?.join("-")||code;
async function derive(pass,salt){
 const material=await crypto.subtle.importKey("raw",encoder.encode(pass),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:PBKDF2_ITERATIONS,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
const recoveryKey=code=>crypto.subtle.importKey("raw",hexBytes(code),"AES-GCM",false,["encrypt","decrypt"]);
async function encrypt(key,data){
 const iv=rand(12);
 return {iv:b64(iv),data:b64(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,encoder.encode(JSON.stringify(data))))};
}
async function decrypt(key,box){
 const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.data));
 return JSON.parse(decoder.decode(plain));
}

/* --- 4. IndexedDB (eine Verbindung, wiederverwendet) -------------------- */
let dbPromise=null;
function openDB(){
 if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{
  const request=indexedDB.open(DB_NAME,1);
  request.onupgradeneeded=()=>request.result.createObjectStore(STORE);
  request.onsuccess=()=>{const db=request.result;db.onversionchange=()=>db.close();resolve(db)};
  request.onerror=()=>reject(request.error);
 });
 return dbPromise;
}
async function dbGet(){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
  const request=db.transaction(STORE,"readonly").objectStore(STORE).get(RECORD_KEY);
  request.onsuccess=()=>resolve(request.result||null);
  request.onerror=()=>reject(request.error);
 });
}
async function dbPut(record){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readwrite");
  tx.objectStore(STORE).put(record,RECORD_KEY);
  tx.oncomplete=()=>resolve();
  tx.onerror=()=>reject(tx.error);
  tx.onabort=()=>reject(tx.error||new Error("Transaktion abgebrochen"));
 });
}

/* --- 5. Zustand --------------------------------------------------------- */
const state={
 key:null,                 // AES-Schlüssel (nur im Speicher)
 record:null,              // verschlüsselter Datensatz aus IndexedDB
 recoveryCode:null,        // Recovery-Key im Klartext (nur im Speicher)
 profiles:[], query:"", editing:null, profileView:null, filter:"all",

};

/* --- 6. Auto-Sperre (Intervall statt Timer-Neuaufbau) ------------------- */
let autoLockTimer=null, activityStamp=0;
function autoLockLabel(){
 const minutes=Number(state.autoLockMinutes)||0;
 if(!minutes)return "Deaktiviert";
 if(minutes<60)return `Nach ${minutes} Minute${minutes===1?"":"n"} Inaktivität`;
 const hours=minutes/60;
 return `Nach ${hours===1?"1 Stunde":hours+" Stunden"} Inaktivität`;
}
function autoLockMessage(){return `BaseVault wurde nach ${autoLockLabel().replace(/^Nach /,"")} automatisch gesperrt.`}
function startAutoLock(){
 stopAutoLock();
 state.lastActivityAt=Date.now();
 activityStamp=0;
 if(!state.key||!Number(state.autoLockMinutes))return;
 autoLockTimer=setInterval(checkAutoLock,AUTOLOCK_CHECK_MS);
}
function stopAutoLock(){if(autoLockTimer){clearInterval(autoLockTimer);autoLockTimer=null}}
function checkAutoLock(){
 if(!state.key)return;
 const limit=Number(state.autoLockMinutes)*60000;
 if(!limit)return;
 if(Date.now()-(state.lastActivityAt||Date.now())>=limit)lockNow(true);
}
function noteActivity(){
 if(!state.key||!Number(state.autoLockMinutes))return;
 const now=Date.now();
 if(now-activityStamp<1000)return;   // höchstens eine Aktualisierung pro Sekunde
 activityStamp=now;
 state.lastActivityAt=now;
}

function normalizeProfiles(list){
 return (Array.isArray(list)?list:[]).map(profile=>({...profile,favorite:!!profile.favorite,active:profile.active!==false,incomes:Array.isArray(profile.incomes)?profile.incomes:[]}));
}
async function readRecoveryCode(record,key){
 if(!record?.wrappedRecoveryKey)return null;
 try{return (await decrypt(key,record.wrappedRecoveryKey)).code}catch(error){return null}
}
function getRecoveryCode(){return state.recoveryCode}

async function applyUnlocked(record,key,profiles,recoveryCode){
 state.key=key;
 state.record=record;
 state.profiles=normalizeProfiles(profiles);
 state.recoveryCode=recoveryCode===undefined?await readRecoveryCode(record,key):recoveryCode;
 state.billingStatus=record.billingStatus||{};
 state.lastSavedAt=record.lastSavedAt||null;
 state.autoLockMinutes=Number(record.autoLockMinutes)||0;
 state.query="";state.filter="all";state.editing=null;state.profileView=null;
 state.incomeProfileId=null;state.billingMonth=null;state.rangeFrom="";state.rangeTo="";

async function createVault(){
 const pass=fieldValue("p1"),repeat=fieldValue("p2");
 if(!pass||pass.length<MIN_PASSWORD_LENGTH)return alert("Bitte mindestens 8 Zeichen verwenden.");
 if(pass!==repeat)return alert("Die Passwörter stimmen nicht überein.");
 const salt=rand(16),key=await derive(pass,salt),recoveryCode=hex(rand(32));
 const record={
  v:SCHEMA_VERSION,salt:b64(salt),
  check:await encrypt(key,{ok:true}),

  wrappedRecoveryKey:await encrypt(key,{code:recoveryCode}),
  autoLockMinutes:0
 };
 await dbPut(record);
 state.key=key;state.record=record;state.recoveryCode=recoveryCode;state.profiles=[];
 state.billingStatus={};state.lastSavedAt=Date.now();state.autoLockMinutes=0;

async function unlock(){
 try{

  if(!record)throw new Error("Kein Tresor gefunden.");
  const key=await derive(fieldValue("loginpass"),unb64(record.salt));
  await decrypt(key,record.check);                       // Passwortprüfung
  await applyUnlocked(record,key,await decrypt(key,record.payload));

async function resetMaster(){

  const code=fieldValue("recoveryInput").replace(/[\s-]/g,"");
  const pass=fieldValue("newMaster"),repeat=fieldValue("newMaster2");
  if(!/^[0-9a-fA-F]{64}$/.test(code))return alert("Der Wiederherstellungsschlüssel muss 64 Hex-Zeichen enthalten.");
  if(!pass||pass.length<MIN_PASSWORD_LENGTH)return alert("Das neue Master-Passwort muss mindestens 8 Zeichen haben.");

  const record=await dbGet();
  if(!record||!record.recovery)throw new Error("Für diesen Tresor ist kein Wiederherstellungsschlüssel eingerichtet.");
  const profiles=await decrypt(await recoveryKey(code),record.recovery);
  const salt=rand(16),key=await derive(pass,salt);
  record.salt=b64(salt);
  record.check=await encrypt(key,{ok:true});
  record.payload=await encrypt(key,profiles);
  record.wrappedRecoveryKey=await encrypt(key,{code});
  record.lastSavedAt=Date.now();
  record.autoLockMinutes=Number(record.autoLockMinutes)||0;
  await dbPut(record);
  alert("Master-Passwort wurde erfolgreich geändert.");
  await applyUnlocked(record,key,profiles,code);
 }catch(error){
  alert("Wiederherstellung fehlgeschlagen. Prüfe den Schlüssel und versuche es erneut.");
 }
}

const isRecoveryCode=value=>/^[0-9a-fA-F]{64}$/.test(String(value||"").replace(/[\s-]/g,""));
async function persist(){
 const record=state.record||(state.record=await dbGet());
 if(!record)throw new Error("Kein Tresor gefunden.");
 record.payload=await encrypt(state.key,state.profiles);
 if(isRecoveryCode(state.recoveryCode)){
  record.recovery=await encrypt(await recoveryKey(state.recoveryCode),state.profiles);
 }
 record.lastSavedAt=state.lastSavedAt=Date.now();

function incomeTotal(profile){return (profile.incomes||[]).reduce((sum,item)=>sum+Number(item.amount||0),0)}
function payoutRate(value){return Number(value||0)>=PAYOUT_THRESHOLD?PAYOUT_RATE_HIGH:PAYOUT_RATE_STANDARD}
function payoutRateLabel(value){return Math.round(payoutRate(value)*100)+" %"}
function payoutTotal(value){const amount=Number(value||0);return amount*payoutRate(amount)}
/* Alle Kennzahlen in einem einzigen Durchlauf über die Einnahmen. */
function incomeStats(){
 const now=new Date();
 const dayKey=toDateKey(now);
 const weekStart=new Date(now);
 weekStart.setHours(0,0,0,0);
 weekStart.setDate(weekStart.getDate()-((weekStart.getDay()+6)%7));
 const weekStartKey=toDateKey(weekStart);
 const monthPrefix=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
 const selectedMonth=state.billingMonth||monthPrefix;
 const {rangeFrom,rangeTo}=state;
 const stats={dayKey,weekStartKey,monthPrefix,selectedMonth,total:0,today:0,week:0,month:0,billingGross:0,billingPayout:0,rangeGross:0,rangePayout:0,payoutAll:0,rows:[]};
 for(const profile of state.profiles){
  const incomes=profile.incomes||[];
  let profileTotal=0,profileMonth=0,profileRange=0;
  for(const income of incomes){
   const amount=Number(income.amount||0),date=String(income.date||"");
   profileTotal+=amount;
   if(date===dayKey)stats.today+=amount;
   if(date>=weekStartKey&&date<=dayKey)stats.week+=amount;
   if(date.startsWith(monthPrefix))stats.month+=amount;
   if(date.startsWith(selectedMonth))profileMonth+=amount;
   if(rangeFrom&&rangeTo&&date>=rangeFrom&&date<=rangeTo)profileRange+=amount;
  }
  stats.total+=profileTotal;
  stats.billingGross+=profileMonth;
  stats.rangeGross+=profileRange;
  stats.payoutAll+=payoutTotal(profileTotal);
  stats.billingPayout+=payoutTotal(profileMonth);
  stats.rangePayout+=payoutTotal(profileRange);
  if(incomes.length)stats.rows.push({profile,total:profileTotal,month:profileMonth,rate:payoutRateLabel(profileMonth),payout:payoutTotal(profileMonth)});
 }
 return stats;
}

 download("basevault-encrypted-backup.json",JSON.stringify({format:"BaseVault encrypted vault",version:record.v,salt:record.salt,check:record.check,payload:record.payload},null,2),"application/json");
}

function showChangeMasterPassword(){
 const modal=document.createElement("div");
 modal.className="change-pass-modal";
 modal.dataset.backdropClose="remove";
 modal.innerHTML=`<div class="change-pass-sheet" role="dialog" aria-modal="true">
   <h3>Master-Passwort ändern</h3>
   <p>Du bist bereits angemeldet. Gib zuerst dein aktuelles Master-Passwort ein und danach das neue Passwort zweimal.</p>
   <div class="field"><div class="label">Aktuelles Master-Passwort</div><input id="changeOldMaster" class="input" type="password" autocomplete="current-password"></div>
   <div class="field"><div class="label">Neues Master-Passwort</div><input id="changeNewMaster" class="input" type="password" autocomplete="new-password"></div>
   <div class="field"><div class="label">Neues Passwort wiederholen</div><input id="changeNewMaster2" class="input" type="password" autocomplete="new-password"></div>
   <div class="change-pass-note">Deine Accounts, Einnahmen, Notizen und dein bestehender Recovery-Key bleiben erhalten. Nur die Verschlüsselung des Tresors wird auf den neuen Schlüssel umgestellt.</div>
   <div class="change-pass-actions"><button class="ghost" data-act="close-modal">Abbrechen</button><button class="primary" data-act="change-pass">Passwort ändern</button></div>
 </div>`;
 document.body.appendChild(modal);
 focusSoon("changeOldMaster");
}
async function changeMasterPassword(){
 const modal=document.querySelector(".change-pass-modal");
 const oldPass=fieldValue("changeOldMaster"),newPass=fieldValue("changeNewMaster"),repeat=fieldValue("changeNewMaster2");
 if(!oldPass)return alert("Bitte dein aktuelles Master-Passwort eingeben.");
 if(!newPass||newPass.length<MIN_PASSWORD_LENGTH)return alert("Das neue Master-Passwort muss mindestens 8 Zeichen haben.");
 if(newPass!==repeat)return alert("Die neuen Passwörter stimmen nicht überein.");
 try{
  const record=state.record||await dbGet();
  if(!record)throw new Error("Kein Tresor gefunden.");
  const oldKey=await derive(oldPass,unb64(record.salt));
  await decrypt(oldKey,record.check);
  const profiles=await decrypt(oldKey,record.payload);
  const salt=rand(16),newKey=await derive(newPass,salt);
  record.salt=b64(salt);
  record.check=await encrypt(newKey,{ok:true});
  record.payload=await encrypt(newKey,profiles);
  if(isRecoveryCode(state.recoveryCode))record.wrappedRecoveryKey=await encrypt(newKey,{code:state.recoveryCode});   // Recovery-Key bleibt nutzbar
  record.lastSavedAt=Date.now();
  record.billingStatus=record.billingStatus||state.billingStatus||{};
  record.autoLockMinutes=Number(state.autoLockMinutes)||Number(record.autoLockMinutes)||0;
  await dbPut(record);
  modal?.remove();
  alert("Master-Passwort wurde erfolgreich geändert.");
  await applyUnlocked(record,newKey,profiles,state.recoveryCode);
 }catch(error){
  alert("Das aktuelle Master-Passwort ist falsch oder der Tresor konnte nicht gelesen werden.");
 }
}

  </section>`;
}
function viewContent(){
 if(currentView==="stats")return viewStats();
 if(currentView==="tools")return viewTools();
 if(currentView==="settings")return viewSettings();
 return "";
}

/* --- 17. Renderer ------------------------------------------------------- */
function renderApp(){
 $("root").innerHTML=`
 <main class="app">
  ${renderHeader()}
  ${currentView==="dashboard"?renderDashboard():viewContent()}
 </main>

 <button type="button" class="fab" title="Profil hinzufügen" data-act="open-editor">＋</button>

 <nav class="bottom">
  <div class="bottom-inner">
   ${NAV_ITEMS.map(item=>`<button type="button" id="nav-${item.id}" class="nav" data-act="set-view" data-view="${item.id}"><span class="ni">${item.icon}</span>${item.label}</button>`).join("")}
  </div>
 </nav>
 ${editor()}${profileDetail()}${incomeEditor()}`;
 activateNav();
 if(currentView==="dashboard")applyListFilter();
}

/* --- 18. Ereignis-Delegation (ein Listener für alle Aktionen) ---------- */
const ACTIONS={
 "set-view":element=>setView(element.dataset.view),
 "focus-search":()=>focusSearch(),
 "lock":()=>lock(),
 "open-editor":element=>openEditor(element.dataset.id||""),
 "close-editor":()=>closeEditor(),
 "toggle-editor-flag":element=>toggleEditorFlag(element.dataset.flag,element),
 "save-profile":()=>saveProfile(),
 "delete-profile":element=>deleteProfile(element.dataset.id),
 "copy-text":element=>copyText(decodeURIComponent(element.dataset.value||"")),
 "set-filter":element=>setFilter(element.dataset.filter),
 "open-profile":element=>openProfile(element.dataset.id),
 "close-profile":()=>closeProfile(),
 "toggle-fav":element=>toggleFavorite(element.dataset.id),
 "toggle-fav-detail":element=>toggleFavorite(element.dataset.id,true),
 "toggle-active-detail":element=>toggleActive(element.dataset.id,true),
 "edit-from-detail":element=>{closeProfile();openEditor(element.dataset.id)},
 "toggle-profile-pass":()=>toggleProfilePass(),
 "copy-profile-pass":()=>copyProfilePass(),
 "open-url":()=>openUrl(),
 "toggle-notes":element=>toggleNotes(element.dataset.id),
 "toggle-income-list":element=>toggleIncomeList(element.dataset.id),
 "open-income":element=>openIncome(element.dataset.id),
 "close-income":()=>closeIncome(),
 "save-income":()=>saveIncome(),
 "edit-income":element=>editIncome(element.dataset.profile,element.dataset.id),
 "delete-income":element=>deleteIncome(element.dataset.profile,element.dataset.id),
 "toggle-billing":element=>toggleBillingStatus(element.dataset.month),
 "create-vault":()=>createVault(),
 "unlock":()=>unlock(),
 "show-login":()=>renderLogin(),
 "show-recovery-reset":()=>showRecoveryReset(),
 "reset-master":()=>resetMaster(),
 "show-change-pass":()=>showChangeMasterPassword(),
 "change-pass":()=>changeMasterPassword(),
 "show-auto-lock":()=>showAutoLockSettings(),
 "set-auto-lock":element=>setAutoLock(element.dataset.minutes),
 "export-vault":()=>exportVault(),
 "show-recovery":()=>showCurrentRecovery(),
 "copy-current-recovery":()=>copyCurrentRecovery(),
 "copy-recovery":element=>copyRecoveryButton(element),
 "export-recovery":()=>exportRecovery(),
 "rotate-recovery":()=>rotateRecovery(),
 "show-about":()=>showAbout(),
 "close-modal":element=>element.closest(".modal, .auto-lock-modal, .change-pass-modal")?.remove()
};
document.addEventListener("click",event=>{
 const element=event.target instanceof Element?event.target:null;
 if(!element)return;
 const target=element.closest("[data-act]");
 if(target){
  const action=ACTIONS[target.dataset.act];
  if(action){event.preventDefault();action(target,event);return}
 }
 if(!element.dataset.backdropClose)return;                                   // Klick auf den Hintergrund
 if(element.dataset.backdropClose==="profile")closeProfile();
 else if(element.dataset.backdropClose==="income")closeIncome();
 else element.remove();
});
document.addEventListener("input",event=>{
 if(event.target.id==="profileSearch"){
  state.query=event.target.value;
  applyListFilter();
 }
});
document.addEventListener("change",event=>{
 const id=event.target.id;
 if(id==="billingMonth")setBillingMonth(event.target.value);
 else if(id==="rangeFrom")setRange(event.target.value,fieldValue("rangeTo"));
 else if(id==="rangeTo")setRange(fieldValue("rangeFrom"),event.target.value);
});
document.addEventListener("keydown",event=>{
 if(event.key==="Enter"&&event.target.dataset?.enter){
  ACTIONS[event.target.dataset.enter]?.();
  return;
 }
 if(event.key!=="Enter"&&event.key!==" ")return;
 const target=event.target;
 if(!(target instanceof HTMLElement)||/^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(target.tagName))return;
 const action=target.dataset.key&&ACTIONS[target.dataset.key];
 if(action){event.preventDefault();action(target,event)}
});
for(const type of ["pointerdown","keydown","touchstart","scroll"])document.addEventListener(type,noteActivity,{passive:true});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkAutoLock()});

/* --- 19. Start ---------------------------------------------------------- */
(async()=>{
 try{
  const record=await dbGet();
  record?renderLogin():renderSetup();
 }catch(error){
  $("root").innerHTML=`<div class="setup"><div class="card"><div class="brand">🔐 BaseVault</div><h2>Speicher nicht verfügbar</h2><p class="small">${esc(error?.message||"IndexedDB ist in diesem Browser nicht verfügbar.")}</p></div></div>`;
 }
})();
</script>
</body>
</html>
