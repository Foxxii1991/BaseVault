<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111014">
<title>BaseVault</title>
<style>
:root{
 --bg:#0b0a0e;--surface:#121117;--surface2:#18171e;--surface3:#211f29;
 --line:#2d2a37;--text:#f7f5fa;--muted:#aaa6b7;--purple:#8b4dff;--purple2:#6330df;
 --green:#43d69b;--danger:#ff6678;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 75% -10%,#21153d 0,#0b0a0e 34%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{border:0;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #9b68ff;outline-offset:2px}
.app{min-height:100vh;max-width:760px;margin:auto;padding:20px 16px 150px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px;min-width:0}
.brandbox{display:flex;align-items:center;gap:11px;flex:1;min-width:0;overflow:hidden}
.brandmark{width:44px;height:44px;flex:0 0 44px;border-radius:15px;background:linear-gradient(145deg,#9c5cff,#5b22cf);display:grid;place-items:center;font-size:22px;box-shadow:0 8px 25px #7d42ff44}
.brand{font-size:25px;font-weight:850;letter-spacing:-.8px;line-height:1;white-space:nowrap}
.brand .accent{color:#8d55ff}
.brandtext{min-width:0;overflow:hidden}
.tagline{color:#8f8a99;font-size:9px;letter-spacing:2.2px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-actions{display:flex;gap:8px;flex:0 0 auto}
.iconbtn{background:#211f28;border:1px solid #302d39;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:21px;transition:.18s}
.iconbtn:hover{background:#292632;border-color:#4d3d69}
.iconbtn.lockbtn{border-color:#7540db;box-shadow:0 0 0 1px #6b39cb22 inset}
.searchwrap{position:relative;margin-bottom:14px}
.search{width:100%;height:58px;background:#17161d;border:1px solid #302d38;border-radius:18px;color:var(--text);padding:0 18px 0 50px;outline:none;font-size:17px}
.search::placeholder{color:#817d8c}
.search:focus{border-color:#7650b7;box-shadow:0 0 0 4px #7f4cff12}
.searchicon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:23px;color:#b8b2c3}
.filters{display:flex;gap:9px;overflow:auto;padding:2px 0 15px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{background:#1b1a21;border:1px solid #292732;color:#c9c5d0;border-radius:999px;padding:10px 16px;white-space:nowrap;font-weight:650}
.filter.active{background:linear-gradient(135deg,#914fff,#622be2);border-color:#985cff;color:white;box-shadow:0 7px 24px #6e35e744}
.card{background:linear-gradient(145deg,#15141b,#0f0e13);border:1px solid #302d39;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 18px 45px #0004}
.empty{padding:28px 18px 20px;text-align:center}
.empty-visual{width:110px;height:84px;margin:5px auto 20px;position:relative}
.folder{position:absolute;left:15px;top:20px;width:82px;height:56px;border:3px solid #575264;border-radius:17px;background:#17151e;transform:skewY(-2deg)}
.folder:before{content:"";position:absolute;left:8px;top:-17px;width:38px;height:22px;border:3px solid #575264;border-bottom:0;border-radius:12px 12px 0 0;background:#17151e}
.folder:after{content:"＋";position:absolute;right:-19px;bottom:-16px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#9a55ff,#6027dd);color:#fff;font-size:27px;border:3px solid #1a1722}
.empty h2{font-size:22px;margin:0 0 8px}
.empty p{color:#aaa6b6;line-height:1.5;margin:0 auto 20px;max-width:560px}
.primary{width:100%;background:linear-gradient(135deg,#914fff,#622be2);color:#fff;border:1px solid #9b62ff;border-radius:16px;padding:14px 16px;font-weight:800;font-size:16px;box-shadow:0 10px 28px #7134e544}
.profile{display:flex;align-items:center;gap:13px}
.avatar{width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,#302b3c,#19171f);display:grid;place-items:center;font-weight:800;font-size:17px;border:1px solid #403b4d}
.grow{flex:1;min-width:0}.name{font-weight:780;font-size:16px}.sub{color:#aaa6b3;font-size:13px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;background:#26232d;color:#c9c4d0;border-radius:999px;padding:5px 9px;font-size:10px;margin-top:8px;letter-spacing:.4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.profile-actions{display:flex;gap:7px}.smallbtn{width:38px;height:38px;border-radius:12px;background:#24212a;color:#cfcad5}
.fab{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:calc(82px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;background:#f5f2f8;color:#111014;font-size:31px;box-shadow:0 16px 35px #0009;z-index:5}
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.feature{min-width:0;background:#121117;border:1px solid #282532;border-radius:18px;padding:16px 8px;text-align:center}
.feature .fi{font-size:23px;color:#ad82ff;margin-bottom:10px}.feature strong{display:block;font-size:12px}.feature span{display:block;color:#8f8a9b;font-size:10px;margin-top:5px;line-height:1.3}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#0e0d12eF;border-top:1px solid #292631;backdrop-filter:blur(18px);display:flex;justify-content:center;z-index:4}
.bottom-inner{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 10px calc(9px + env(safe-area-inset-bottom))}
.nav{background:transparent;color:#9994a4;padding:8px 4px;border-radius:16px;font-size:11px}.nav .ni{display:block;font-size:21px;margin-bottom:3px}.nav.active{background:#241b39;color:#fff}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.modal.open{display:flex}
.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#17161d;border:1px solid #35313e;border-radius:25px;padding:20px;box-shadow:0 -10px 50px #0009}
.sheet h2{margin:0 0 16px}.field{margin:12px 0}.label{font-size:12px;color:#9f9aa9;margin-bottom:6px}
.input,.textarea{width:100%;background:#211f27;border:1px solid #36323f;color:var(--text);border-radius:13px;padding:12px;outline:none}.textarea{min-height:90px;resize:vertical}
.value{background:#211f27;border:1px solid #36323f;border-radius:13px;padding:12px;display:flex;align-items:center;gap:8px}.value span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.value button{background:none}
.actions{display:flex;gap:9px;margin-top:16px}.actions>*{flex:1}.ghost{background:#28252e;border-radius:13px;padding:12px}.danger{background:#351b22;color:#ff9ca8}
.setup{min-height:100vh;display:grid;place-items:center;padding:22px}.setup .card{max-width:460px;width:100%}.small{font-size:12px;color:#aaa6b6;line-height:1.5}.hidden{display:none!important}
@media(max-width:560px){
 .app{padding-left:13px;padding-right:13px}
 header{gap:8px;margin-bottom:16px}
 .brandbox{gap:8px}
 .brandmark{width:38px;height:38px;flex-basis:38px;border-radius:13px;font-size:19px}
 .brand{font-size:20px;letter-spacing:-.6px}
 .tagline{font-size:7px;letter-spacing:1.55px;margin-top:5px}
 .head-actions{gap:5px}
 .head-actions .iconbtn{width:39px;height:39px;border-radius:13px;font-size:18px}
 .feature-grid{grid-template-columns:repeat(2,1fr)}
}

.view-grid{display:grid;gap:12px}.view-hero{padding:22px}.view-kicker{font-size:10px;letter-spacing:2.5px;color:#a77cff;font-weight:800}.view-hero h2{font-size:27px;margin:8px 0}.view-hero p{color:#aaa6b6;margin:0;line-height:1.5}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat-card{background:#15141b;border:1px solid #302d39;border-radius:20px;padding:18px}.stat-card span,.stat-card small{display:block;color:#9691a2;font-size:12px}.stat-card strong{display:block;font-size:28px;margin:7px 0}.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tool-card{text-align:left;background:linear-gradient(145deg,#181620,#111016);border:1px solid #312d3c;border-radius:20px;padding:17px;min-height:140px}.tool-card:hover{border-color:#7650b7;background:#1b1822}.tool-icon{display:block;font-size:25px;color:#aa78ff;margin-bottom:12px}.tool-card strong,.tool-card small{display:block}.tool-card small{color:#9893a3;margin-top:6px;line-height:1.4}.tool-list{display:grid;gap:2px}.tool-list>div{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #292631}.tool-list>div:last-child{border-bottom:0}.tool-list span{display:flex;flex-direction:column;gap:4px}.tool-list small{color:#94909e}.settings-list{padding:7px}.settings-list button{width:100%;display:grid;grid-template-columns:30px 1fr 20px;align-items:center;text-align:left;gap:9px;background:transparent;padding:15px 10px;border-radius:14px}.settings-list button:hover{background:#211e29}.settings-list button span:nth-child(2){display:flex;flex-direction:column;gap:4px}.settings-list small{color:#94909e}.settings-list i{color:#817b8c;font-size:24px;font-style:normal}.danger-card{border-color:#432730}
@media(max-width:560px){.tool-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:390px){.tool-grid{grid-template-columns:1fr}}

.profile-card{cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}.profile-card:hover{transform:translateY(-1px);border-color:#5d4a79;box-shadow:0 12px 32px #0005}.profile-card:focus-visible{outline:2px solid #9b68ff;outline-offset:2px}
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}.detail-avatar{width:58px;height:58px}.detail-title{font-size:22px;font-weight:800}.profile-sheet{padding:20px}.password-value{min-height:48px}.password-value button{background:#292630;border-radius:10px;padding:7px 10px;white-space:nowrap}.notes-box{background:#211f27;border:1px solid #36323f;border-radius:13px;padding:12px;color:#c5c0cc;white-space:pre-wrap;line-height:1.5}

.fullbtn{width:100%;margin-top:10px}.recovery-sheet{text-align:center}.recovery-icon{font-size:42px;margin-bottom:6px}.recovery-code{margin:18px 0;padding:16px;background:#100e15;border:1px solid #6f45aa;border-radius:15px;color:#d7c4ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.8;word-break:break-all}.recovery-warning{background:#2d1d24;border:1px solid #58303b;color:#e9aeb8;border-radius:13px;padding:12px;text-align:left;font-size:12px;line-height:1.5}

.recovery-manager{display:grid;gap:9px}.recovery-manager .settings-list{margin:0}.recovery-note{font-size:12px;color:#aaa6b6;line-height:1.5;margin:4px 2px 0}.recovery-key-preview{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#100e15;border:1px solid #4c376a;border-radius:12px;padding:12px;color:#d9c8ff;word-break:break-all}

.favorite-btn{font-size:20px;color:#aaa3b2}.favorite-btn.is-favorite{color:#b978ff;background:#2b1d3d}.favorite-detail{color:#c58bff;border-color:#6e43a4}.pill .dot.off{background:#716b78}
@media(max-height:760px){
 .fab{bottom:calc(76px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:17px;font-size:28px}
}
@media(max-width:390px){
 .brandmark{width:34px;height:34px;flex-basis:34px;font-size:17px}
 .brand{font-size:18px}
 .tagline{font-size:6.5px;letter-spacing:1.2px}
 .head-actions .iconbtn{width:36px;height:36px;border-radius:12px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const APP="BaseVault", DB="basevault-db", STORE="vault";
let state={key:null,profiles:[],query:"",editing:null,profileView:null,filter:"all"};

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rand=n=>crypto.getRandomValues(new Uint8Array(n));
const hex=a=>Array.from(new Uint8Array(a),b=>b.toString(16).padStart(2,"0")).join("");
const hexBytes=s=>{if(!/^[0-9a-fA-F]{64}$/.test(s))throw new Error("Ungültiger Wiederherstellungsschlüssel");const a=new Uint8Array(32);for(let i=0;i<64;i+=2)a[i/2]=parseInt(s.slice(i,i+2),16);return a};
async function recoveryKey(code){return crypto.subtle.importKey("raw",hexBytes(code.trim().replace(/[\s-]/g,"")),"AES-GCM",false,["encrypt","decrypt"])}
function formatRecoveryCode(code){return code.match(/.{1,8}/g)?.join("-")||code}


function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbGet(){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,"readonly"),r=t.objectStore(STORE).get("vault");r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function dbPut(v){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,"readwrite");t.objectStore(STORE).put(v,"vault");t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function derive(pass,salt){return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]),{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encrypt(key,data){const iv=rand(12),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(data)));return {iv:b64(iv),data:b64(ct)}}
async function decrypt(key,obj){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(obj.iv)},key,unb64(obj.data));return JSON.parse(new TextDecoder().decode(pt))}
function renderSetup(){document.getElementById("root").innerHTML=`<div class="setup"><div class="card"><div class="brand">🔐 BaseVault</div><h2>Dein lokaler Tresor</h2><p class="small">Lege ein Master-Passwort fest. Die Zugangsdaten werden lokal im Browser verschlüsselt gespeichert. Das Passwort selbst wird nicht gespeichert.</p><div class="field"><div class="label">Master-Passwort</div><input id="p1" class="input" type="password" autocomplete="new-password"></div><div class="field"><div class="label">Wiederholen</div><input id="p2" class="input" type="password" autocomplete="new-password"></div><button class="primary" onclick="createVault()">Tresor erstellen</button></div></div>`}
async function createVault(){
 const a=p1.value,b=p2.value;
 if(!a||a.length<8)return alert("Bitte mindestens 8 Zeichen verwenden.");
 if(a!==b)return alert("Die Passwörter stimmen nicht überein.");
 const salt=rand(16),key=await derive(a,salt);
 const recoveryCode=hex(rand(32));
 const rkey=await recoveryKey(recoveryCode);
 const empty=[];
 const record={v:2,salt:b64(salt),check:await encrypt(key,{ok:true}),payload:await encrypt(key,empty),recovery:await encrypt(rkey,empty),wrappedRecoveryKey:await encrypt(key,{code:recoveryCode})};
 await dbPut(record);
 state.key=key;state.profiles=[];
 alert("Tresor erstellt. Dein Wiederherstellungsschlüssel wird jetzt angezeigt. Speichere ihn sicher außerhalb der App.");
 showRecoveryCode(recoveryCode,true);
 renderApp();
}
function showRecoveryCode(code,first=false){
 const modal=document.createElement("div");
 modal.className="modal open";
 modal.innerHTML=`<div class="sheet recovery-sheet">
  <div class="recovery-icon">🔑</div>
  <h2>${first?"Wiederherstellungsschlüssel":"Recovery-Schlüssel"}</h2>
  <p class="small">Mit diesem Schlüssel kannst du dein Master-Passwort zurücksetzen, ohne die gespeicherten Accounts zu verlieren.</p>
  <div class="recovery-code">${esc(formatRecoveryCode(code))}</div>
  <div class="recovery-warning">⚠️ Dieser Schlüssel wird nicht von BaseVault gespeichert. Wer ihn besitzt, kann deinen Tresor zurücksetzen. Speichere ihn sicher.</div>
  <div class="actions"><button type="button" class="ghost" onclick="copyRecovery('${code}');this.textContent='✓ Kopiert'">📋 Kopieren</button><button type="button" class="ghost" onclick="exportRecovery()">📄 Export</button><button type="button" class="primary" onclick="this.closest('.modal').remove()">Schließen</button></div>
 </div>`;
 document.body.appendChild(modal);
}
async function copyRecovery(code){
 await navigator.clipboard.writeText(formatRecoveryCode(code));
 setTimeout(()=>navigator.clipboard.writeText("").catch(()=>{}),30000);
}
function renderLogin(){
 document.getElementById("root").innerHTML=`<div class="setup"><div class="card"><div class="brand">🔐 BaseVault</div><h2>Tresor entsperren</h2><p class="small">Deine Daten bleiben verschlüsselt. Ohne Master-Passwort oder Wiederherstellungsschlüssel gibt es keinen Klartextzugriff.</p><div class="field"><div class="label">Master-Passwort</div><input id="loginpass" class="input" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')unlock()"></div><button class="primary" onclick="unlock()">Entsperren</button><button class="ghost fullbtn" onclick="showRecoveryReset()">Master-Passwort vergessen?</button></div></div>`;
}
function showRecoveryReset(){
 document.getElementById("root").innerHTML=`<div class="setup"><div class="card"><div class="brand">🔐 BaseVault</div><h2>Master-Passwort zurücksetzen</h2><p class="small">Gib deinen 64-stelligen Wiederherstellungsschlüssel ein. Ohne ihn kann ein vergessenes Master-Passwort aus Sicherheitsgründen nicht zurückgesetzt werden.</p><div class="field"><div class="label">Wiederherstellungsschlüssel</div><input id="recoveryInput" class="input" placeholder="z. B. 7f2a... (64 Zeichen)" autocomplete="off"></div><div class="field"><div class="label">Neues Master-Passwort</div><input id="newMaster" class="input" type="password" autocomplete="new-password"></div><div class="field"><div class="label">Neues Passwort wiederholen</div><input id="newMaster2" class="input" type="password" autocomplete="new-password"></div><div class="actions"><button class="ghost" onclick="renderLogin()">Abbrechen</button><button class="primary" onclick="resetMaster()">Master-Passwort setzen</button></div></div></div>`;
}
async function resetMaster(){
 try{
  const code=recoveryInput.value.replace(/[\s-]/g,"");
  const newPass=newMaster.value,newPass2=newMaster2.value;
  if(!/^[0-9a-fA-F]{64}$/.test(code))return alert("Der Wiederherstellungsschlüssel muss 64 Hex-Zeichen enthalten.");
  if(!newPass||newPass.length<8)return alert("Das neue Master-Passwort muss mindestens 8 Zeichen haben.");
  if(newPass!==newPass2)return alert("Die neuen Passwörter stimmen nicht überein.");
  const v=await dbGet();
  if(!v||!v.recovery)throw new Error("Für diesen Tresor ist kein Wiederherstellungsschlüssel eingerichtet.");
  const rkey=await recoveryKey(code);
  const profiles=await decrypt(rkey,v.recovery);
  const salt=rand(16),key=await derive(newPass,salt);
  v.salt=b64(salt);
  v.check=await encrypt(key,{ok:true});
  v.payload=await encrypt(key,profiles);
  await dbPut(v);
  state.key=key;state.profiles=profiles;state.profileView=null;state.editing=null;
  alert("Master-Passwort wurde erfolgreich geändert.");
  renderApp();
 }catch(e){alert("Wiederherstellung fehlgeschlagen. Prüfe den Schlüssel und versuche es erneut.")}
}
async function unlock(){try{const v=await dbGet(),key=await derive(document.getElementById("loginpass").value,unb64(v.salt));await decrypt(key,v.check);state.key=key;state.profiles=(await decrypt(key,v.payload)).map(p=>({...p,favorite:!!p.favorite,active:p.active!==false}));renderApp()}catch(e){alert("Falsches Master-Passwort oder beschädigter Tresor.")}}

let currentView="dashboard";

function setView(view){
 currentView=view;
 state.editing=null;
 renderApp();
 window.scrollTo({top:0,behavior:"smooth"});
}

function activateNav(){
 ["dashboard","stats","tools","settings"].forEach(v=>{
   const el=document.getElementById("nav-"+v);
   if(el) el.classList.toggle("active", currentView===v);
 });
}

function viewContent(){
 if(currentView==="stats") return `
  <section class="view-grid">
   <div class="card view-hero"><div class="view-kicker">ÜBERSICHT</div><h2>Statistiken</h2><p>Deine Account-Verwaltung kompakt auf einen Blick.</p></div>
   <div class="stat-grid">
    <div class="stat-card"><span>Profile</span><strong>${state.profiles.length}</strong><small>gespeicherte Accounts</small></div>
    <div class="stat-card"><span>4based</span><strong>${state.profiles.length}</strong><small>Vault-Einträge</small></div>
    <div class="stat-card"><span>Favoriten</span><strong>${state.profiles.filter(p=>!!p.favorite).length}</strong><small>${state.profiles.filter(p=>!!p.favorite).length===1?"1 Profil markiert":""+state.profiles.filter(p=>!!p.favorite).length+" Profile markiert"}</small></div>
    <div class="stat-card"><span>Aktiv</span><strong>${state.profiles.filter(p=>p.active!==false).length}</strong><small>${state.profiles.filter(p=>p.active!==false).length===1?"1 Profil aktiv":state.profiles.filter(p=>p.active!==false).length+" Profile aktiv"}</small></div>
   </div>
   <div class="card"><h3>Account-Aktivität</h3><p class="small">${state.profiles.filter(p=>!!p.favorite).length} Favoriten · ${state.profiles.filter(p=>p.active!==false).length} aktive Profile · lokal gespeichert und verschlüsselt.</p></div>
  </section>`;

async function getRecoveryCode(){
 const v=await dbGet();
 if(!v||!v.wrappedRecoveryKey) return null;
 try{
   const wrapped=await decrypt(state.key,v.wrappedRecoveryKey);
   return wrapped.code;
 }catch(e){return null}
}
async function setupRecovery(forceRotate=false){
 const v=await dbGet();
 if(v.recovery && !forceRotate){
   const existing=await getRecoveryCode();
   if(existing) return showRecoveryCode(existing,false);
 }
 const code=hex(rand(32));
 const rkey=await recoveryKey(code);
 v.recovery=await encrypt(rkey,state.profiles);
 v.wrappedRecoveryKey=await encrypt(state.key,{code});
 await dbPut(v);
 showRecoveryCode(code,false);
}
async function rotateRecovery(){
 const current=await getRecoveryCode();
 if(!current)return setupRecovery(false);
 if(!confirm("Einen neuen Recovery-Key erzeugen? Der bisherige Recovery-Key wird danach ungültig."))return;
 await setupRecovery(true);
}
async function exportRecovery(){
 const code=await getRecoveryCode();
 if(!code)return alert("Für diesen Tresor ist noch kein Recovery-Key eingerichtet.");
 const blob=new Blob([
  "BASEVAULT RECOVERY KEY\n\n"+
  formatRecoveryCode(code)+
  "\n\nBewahre diesen Schlüssel sicher auf. Er wird benötigt, um das Master-Passwort zurückzusetzen."
 ],{type:"text/plain;charset=utf-8"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="basevault-recovery-key.txt";
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function copyCurrentRecovery(){
 const code=await getRecoveryCode();
 if(!code)return alert("Für diesen Tresor ist noch kein Recovery-Key eingerichtet.");
 await copyRecovery(code);
 alert("Recovery-Key wurde kopiert. Bewahre ihn sicher auf.");
}
async function showCurrentRecovery(){
 const code=await getRecoveryCode();
 if(!code)return setupRecovery(false);
 showRecoveryCode(code,false);
}
async function exportVault(){
 const v=await dbGet();
 if(!v)return;
 const blob=new Blob([JSON.stringify({format:"BaseVault encrypted vault",version:v.v,salt:v.salt,check:v.check,payload:v.payload},null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="basevault-encrypted-backup.json";
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function toggleActive(id){

function focusSearch(){

}

function openProfile(id){
 const p=state.profiles.find(x=>x.id===id);
 if(!p)return;
 state.profileView={...p,showPass:false};

}
function closeProfile(){state.profileView=null;renderApp()}
function toggleProfilePass(){if(!state.profileView)return;state.profileView.showPass=!state.profileView.showPass;renderApp()}
function copyProfilePass(){
 const p=state.profileView;if(!p)return;
 navigator.clipboard.writeText(p.pass).then(()=>{
   const b=document.getElementById("copyPassBtn");
   if(b){b.textContent="✓ Kopiert";setTimeout(()=>{if(document.getElementById("copyPassBtn"))document.getElementById("copyPassBtn").textContent="📋 Kopieren"},1200)}
   setTimeout(()=>navigator.clipboard.writeText("").catch(()=>{}),30000);
 });
}

function openEditor(id){const p=state.profiles.find(x=>x.id===id);state.editing=p?{...p}: {id:"",name:"",user:"",pass:"",url:"https://4based.com/",notes:""};renderApp();setTimeout(()=>document.getElementById("fName")?.focus(),0)}
function closeEditor(){state.editing=null;renderApp()}
async function saveProfile(){const p=state.editing;p.name=document.getElementById("fName").value.trim();p.user=document.getElementById("fUser").value.trim();p.pass=document.getElementById("fPass").value;p.url=document.getElementById("fUrl").value.trim()||"https://4based.com/";p.notes=document.getElementById("fNotes").value;if(!p.name||!p.user||!p.pass)return alert("Name, Username und Passwort brauchen einen Wert.");if(!/^https:\/\/4based\.com(?:\/|$)/i.test(p.url))return alert("Bitte eine gültige 4based-URL verwenden.");if(!p.id){p.id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));state.profiles.unshift(p)}else{const i=state.profiles.findIndex(x=>x.id===p.id);state.profiles[i]=p}await persist();state.editing=null;renderApp()}
async function deleteProfile(id){if(!confirm("Profil wirklich löschen?"))return;state.profiles=state.profiles.filter(p=>p.id!==id);await persist();state.editing=null;renderApp()}
async function persist(){
 const v=await dbGet();
 v.payload=await encrypt(state.key,state.profiles);
 if(v.wrappedRecoveryKey){
   const wrapped=await decrypt(state.key,v.wrappedRecoveryKey);
   const rkey=await recoveryKey(wrapped.code);
   v.recovery=await encrypt(rkey,state.profiles);
 }
 await dbPut(v);
}
function togglePass(){const el=document.getElementById("fPass");el.type=el.type==="password"?"text":"password"}
async function copyCurrent(id){const el=document.getElementById(id);if(!el)return;await copyText(el.value)}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}setTimeout(()=>{try{navigator.clipboard.writeText("")}catch(e){}},30000)}
function openUrl(){const url=document.getElementById("fUrl").value.trim();if(/^https:\/\/4based\.com(?:\/|$)/i.test(url))window.open(url,"_blank","noopener,noreferrer")}
function lock(){state.key=null;state.profiles=[];state.editing=null;state.profileView=null;renderLogin()}
(async()=>{const v=await dbGet();v?renderLogin():renderSetup()})();
